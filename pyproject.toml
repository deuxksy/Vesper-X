[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vesper-x"
version = "0.1.0"
description = "Vesper-X: Direct Link Extractor & Shortener Bypass Automation Suite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "aria2p>=0.11.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
vesper = "vesper_x.cli:app"
url-resolver = "vesper_x.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]
